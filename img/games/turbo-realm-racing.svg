      <rect x="0" y="300" width="800" height="3" fill="#000"/><rect x="0" y="311.2" width="800" height="4.6" fill="#000"/><rect x="0" y="321.44" width="800" height="6.199999999999999" fill="#000"/><rect x="0" y="330.72" width="800" height="7.799999999999999" fill="#000"/><rect x="0" y="339.04" width="800" height="9.399999999999999" fill="#000"/><rect x="0" y="346.40000000000003" width="800" height="10.999999999999998" fill="#000"/>
    </mask>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <clipPath id="sky-clip"><rect width="800" height="352"/></clipPath>
    <style>
    .tw { animation: tw 4s ease-in-out infinite; }
    @keyframes tw { 50% { opacity: .15; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
      .pulse { animation: pulse 5s ease-in-out infinite; transform-origin: 400px 290px; }
      @keyframes pulse { 50% { opacity: .65; } }
      .lights { animation: lights 2.4s ease-in-out infinite; }
      @keyframes lights { 50% { opacity: .7; } }
    </style>
  </defs>

